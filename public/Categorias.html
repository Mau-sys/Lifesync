<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Categorías disponibles en LifeSync"
        data-i18n="categorias.descripcionMeta">

    <title
        data-i18n="categorias.tituloPagina">
        LifeSync | Categorías
    </title>


    <!-- ESTILOS -->

    <link
        rel="stylesheet"
        href="css/variables.css">

    <link
        rel="stylesheet"
        href="css/general.css">

    <link
        rel="stylesheet"
        href="css/categorias.css">


</head>


<body>


    <main class="contenedor-categorias">


        <!-- =================================================
             ENCABEZADO
        ================================================== -->

        <header class="encabezado">


            <a
                href="inicio.html"
                class="volver"
                data-i18n="comun.volver">

                ← Volver

            </a>


            <h1
                data-i18n="categorias.titulo">

                Categorías

            </h1>


            <p
                data-i18n="categorias.descripcion">

                Selecciona una categoría para
                administrar tus hábitos.

            </p>


        </header>



        <!-- =================================================
             LISTA REAL DE CATEGORÍAS

             Las tarjetas serán creadas por
             categorias.js utilizando los datos
             provenientes de categorias.php.
        ================================================== -->

        <section
            id="listaCategorias"
            class="lista-categorias">

        </section>



        <!-- =================================================
             MENSAJES

             Aquí aparecerán errores o mensajes
             cuando no existan categorías.
        ================================================== -->

        <section
            id="mensajeCategorias"
            class="mensaje-categorias">

        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT GLOBAL
    ====================================================== -->

    <script
        src="js/idioma-global.js">
    </script>


    <script
        src="js/tema-global.js">
    </script>



    <!-- =====================================================
         JAVASCRIPT DE CATEGORÍAS
    ====================================================== -->

    <script
        src="js/categorias.js">
    </script>


</body>

</html>
