<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Estadísticas del progreso del usuario"
        data-i18n="estadisticas.descripcion">

    <title>LifeSync | Estadísticas</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/estadisticas.css">

</head>

<body>

    <main class="contenedor-estadisticas">

        <header class="encabezado">

            <a
                href="perfil.html"
                class="volver"
                data-i18n="comun.volver">

                ← Volver

            </a>

            <h1 data-i18n="estadisticas.titulo">
                Estadísticas
            </h1>

            <p data-i18n="estadisticas.descripcion">
                Consulta tu progreso y analiza el cumplimiento de tus hábitos.
            </p>

        </header>


        <section
            class="resumen-general"
            aria-label="Resumen general"
            data-i18n-aria-label="estadisticas.resumenGeneral">

            <article class="tarjeta-resumen">

                <h2 data-i18n="estadisticas.progresoGeneral">
                    Progreso general
                </h2>

                <p id="progresoGeneral">0%</p>

            </article>


            <article class="tarjeta-resumen">

                <h2 data-i18n="estadisticas.diasRacha">
                    Días en racha
                </h2>

                <p id="diasRacha">0</p>

            </article>


            <article class="tarjeta-resumen">

                <h2 data-i18n="estadisticas.habitosCompletados">
                    Hábitos completados
                </h2>

                <p id="habitosCompletados">0</p>

            </article>

        </section>


        <section class="filtro">

            <label
                for="periodo"
                data-i18n="estadisticas.mostrarEstadisticas">

                Mostrar estadísticas de:

            </label>

            <select
                id="periodo"
                name="periodo">

                <option
                    value="semana"
                    data-i18n="estadisticas.estaSemana">

                    Esta semana

                </option>

                <option
                    value="mes"
                    data-i18n="estadisticas.esteMes">

                    Este mes

                </option>

                <option
                    value="anio"
                    data-i18n="estadisticas.esteAnio">

                    Este año

                </option>

            </select>

        </section>


        <section class="grafica-general">

            <h2 data-i18n="estadisticas.progresoGeneral">
                Progreso general
            </h2>

            <div
                id="graficaGeneral"
                class="grafica"
                aria-label="Gráfica de progreso"
                data-i18n-aria-label="estadisticas.graficaProgreso">

            </div>

        </section>


        <section class="estadisticas-categorias">

            <h2 data-i18n="estadisticas.categorias">
                Categorías
            </h2>

            <div id="listaCategorias"></div>

        </section>


        <section class="estadisticas-habitos">

            <h2 data-i18n="estadisticas.habitosPersonalizados">
                Hábitos personalizados
            </h2>

            <div id="listaHabitos"></div>

        </section>


        <p
            id="mensajeEstadisticas"
            class="mensaje"
            role="alert"
            aria-live="polite">

        </p>

    </main>


    <script src="js/idioma-global.js"></script>
    <script src="js/tema-global.js"></script>
    <script src="js/estadisticas.js"></script>

</body>

</html>
