<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Administra tus hábitos personalizados">

    <title>LifeSync | Hábitos personalizados</title>

    <link rel="stylesheet"
          href="css/variables.css">

    <link rel="stylesheet"
          href="css/general.css">

    <link rel="stylesheet"
          href="css/Personalizados.css">

</head>

<body>

    <main class="personalizados">

        <header class="encabezado">

            <a
                href="perfil.html"
                class="volver">

                ← Volver

            </a>

            <h1>

                Hábitos personalizados

            </h1>

            <p>

                Administra todos tus hábitos personalizados desde un solo lugar.

            </p>

        </header>


        <button
            type="button"
            id="btnNuevoHabito"
            class="btn-principal btn-nuevo">

            + Nuevo hábito

        </button>


        <section class="lista-habitos">

            <div id="contenedorHabitos">

            </div>

        </section>

    </main>


    <div
        id="modalNuevoHabito"
        class="modal oculto">

        <div class="modal-contenido">

            <div class="modal-header">

                <h2>

                    Nuevo hábito

                </h2>

                <button
                    type="button"
                    id="cerrarModal"
                    class="btn-cerrar"
                    aria-label="Cerrar">

                    ✕

                </button>

            </div>


            <form
                id="habitoForm"
                class="habit-form">


                <div class="input-group">

                    <label for="nombreHabito">

                        Nombre del hábito

                    </label>

                    <input
                        type="text"
                        id="nombreHabito"
                        name="nombreHabito"
                        placeholder="Ej. Leer 20 páginas"
                        maxlength="150"
                        required>

                </div>


                <div class="input-group">

                    <label for="objetivo">

                        Objetivo

                    </label>

                    <textarea
                        id="objetivo"
                        name="objetivo"
                        rows="3"
                        placeholder="Describe qué quieres lograr con este hábito."
                        maxlength="500"
                        required></textarea>

                </div>


                <div class="input-group">

                    <label for="frecuencia">

                        Frecuencia

                    </label>

                    <select
                        id="frecuencia"
                        name="frecuencia"
                        required>

                        <option value="">

                            Selecciona una opción

                        </option>

                        <option value="diaria">

                            Diario

                        </option>

                        <option value="semanal">

                            Semanal

                        </option>

                        <option value="mensual">

                            Mensual

                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label for="fechaInicio">

                        Fecha de inicio

                    </label>

                    <input
                        type="date"
                        id="fechaInicio"
                        name="fechaInicio"
                        required>

                </div>


                <div class="input-group">

                    <label for="fechaFin">

                        Fecha de finalización

                    </label>

                    <input
                        type="date"
                        id="fechaFin"
                        name="fechaFin">

                </div>


                <div class="acciones-modal">

                    <button
                        type="button"
                        id="cancelarModal"
                        class="btn-secundario">

                        Cancelar

                    </button>


                    <button
                        type="submit"
                        class="btn-principal">

                        Guardar hábito

                    </button>

                </div>

            </form>

        </div>

    </div>


    <div
        id="modalEliminar"
        class="modal oculto">

        <div class="modal-contenido modal-pequeno">

            <h2>

                ¿Eliminar hábito?

            </h2>

            <p>

                Esta acción no se puede deshacer.

            </p>


            <div class="acciones-modal">

                <button
                    type="button"
                    id="cancelarEliminar"
                    class="btn-secundario">

                    Cancelar

                </button>


                <button
                    type="button"
                    id="confirmarEliminar"
                    class="btn-peligro">

                    Eliminar

                </button>

            </div>

        </div>

    </div>


    <script src="js/personalizados.js"></script>

</body>

</html>
