<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Administra tus hábitos personalizados"
          data-i18n="personalizados.metaDescripcion">

    <title>LifeSync | Hábitos personalizados</title>

    <link rel="stylesheet"
          href="css/variables.css">

    <link rel="stylesheet"
          href="css/general.css">

    <link rel="stylesheet"
          href="css/Personalizados.css">

</head>

<body>

    <main class="personalizados">

        <header class="encabezado">

            <a
                href="perfil.html"
                class="volver"
                data-i18n="comun.volver">

                ← Volver

            </a>

            <h1 data-i18n="personalizados.titulo">

                Hábitos personalizados

            </h1>

            <p data-i18n="personalizados.descripcion">

                Administra todos tus hábitos personalizados desde un solo lugar.

            </p>

        </header>


        <button
            type="button"
            id="btnNuevoHabito"
            class="btn-principal btn-nuevo"
            data-i18n="personalizados.nuevoHabito">

            + Nuevo hábito

        </button>


        <section class="lista-habitos">

            <div id="contenedorHabitos">

            </div>

        </section>

    </main>


    <!-- Modal para crear hábito -->

    <div
        id="modalNuevoHabito"
        class="modal oculto">

        <div class="modal-contenido">

            <div class="modal-header">

                <h2 data-i18n="personalizados.modalNuevoTitulo">

                    Nuevo hábito

                </h2>

                <button
                    type="button"
                    id="cerrarModal"
                    class="btn-cerrar"
                    aria-label="Cerrar"
                    data-i18n-aria-label="comun.cerrar">

                    ✕

                </button>

            </div>


            <form
                id="habitoForm"
                class="habit-form">


                <div class="input-group">

                    <label
                        for="nombreHabito"
                        data-i18n="personalizados.nombreHabito">

                        Nombre del hábito

                    </label>

                    <input
                        type="text"
                        id="nombreHabito"
                        name="nombreHabito"
                        placeholder="Ej. Leer 20 páginas"
                        data-i18n-placeholder="personalizados.placeholderNombre"
                        maxlength="150"
                        required>

                </div>


                <div class="input-group">

                    <label
                        for="objetivo"
                        data-i18n="personalizados.objetivo">

                        Objetivo

                    </label>

                    <textarea
                        id="objetivo"
                        name="objetivo"
                        rows="3"
                        placeholder="Describe qué quieres lograr con este hábito."
                        data-i18n-placeholder="personalizados.placeholderObjetivo"
                        maxlength="500"
                        required></textarea>

                </div>


                <div class="input-group">

                    <label
                        for="frecuencia"
                        data-i18n="personalizados.frecuencia">

                        Frecuencia

                    </label>

                    <select
                        id="frecuencia"
                        name="frecuencia"
                        required>

                        <option
                            value=""
                            data-i18n="personalizados.seleccionaOpcion">

                            Selecciona una opción

                        </option>

                        <option
                            value="diaria"
                            data-i18n="personalizados.diario">

                            Diario

                        </option>

                        <option
                            value="semanal"
                            data-i18n="personalizados.semanal">

                            Semanal

                        </option>

                        <option
                            value="mensual"
                            data-i18n="personalizados.mensual">

                            Mensual

                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label
                        for="fechaInicio"
                        data-i18n="personalizados.fechaInicio">

                        Fecha de inicio

                    </label>

                    <input
                        type="date"
                        id="fechaInicio"
                        name="fechaInicio"
                        required>

                </div>


                <div class="input-group">

                    <label
                        for="fechaFin"
                        data-i18n="personalizados.fechaFin">

                        Fecha de finalización

                    </label>

                    <input
                        type="date"
                        id="fechaFin"
                        name="fechaFin">

                </div>


                <div class="acciones-modal">

                    <button
                        type="button"
                        id="cancelarModal"
                        class="btn-secundario"
                        data-i18n="comun.cancelar">

                        Cancelar

                    </button>


                    <button
                        type="submit"
                        class="btn-principal"
                        data-i18n="personalizados.guardarHabito">

                        Guardar hábito

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Modal para eliminar hábito -->

    <div
        id="modalEliminar"
        class="modal oculto">

        <div class="modal-contenido modal-pequeno">

            <h2 data-i18n="personalizados.eliminarTitulo">

                ¿Eliminar hábito?

            </h2>

            <p data-i18n="personalizados.eliminarDescripcion">

                Esta acción no se puede deshacer.

            </p>


            <div class="acciones-modal">

                <button
                    type="button"
                    id="cancelarEliminar"
                    class="btn-secundario"
                    data-i18n="comun.cancelar">

                    Cancelar

                </button>


                <button
                    type="button"
                    id="confirmarEliminar"
                    class="btn-peligro"
                    data-i18n="comun.eliminar">

                    Eliminar

                </button>

            </div>

        </div>

    </div>

    <script src="js/tema-global.js"></script>
    <script src="js/idioma-global.js"></script>
    <script src="js/personalizados.js"></script>

</body>

</html>
