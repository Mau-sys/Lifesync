<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSync - Salud Mental</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/SaludMental.css">
</head>
<body class="bg-lifesync p-0 m-0">

    <div class="card-full-screen d-flex flex-column justify-content-between">
        
        <div>
            <div class="d-flex justify-content-end align-items-center mb-3">
            <div class="position-relative">
                <button class="btn btn-options p-0" id="btn-options-saludmental" aria-label="Opciones">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>

                <div class="kebab-dropdown-menu" id="kebab-menu-saludmental">
                    <a href="inicio.html" class="kebab-item" id="btn-regresar">
                        <i class="fa-solid fa-arrow-left me-2"></i>Regresar
                    </a>
                    <a href="#" class="kebab-item" id="btn-editar-meta">
                        <i class="fa-solid fa-pen-to-square me-2"></i>Editar meta
                    </a>
                    <div class="dropdown-divider my-1"></div>
                   <a href="#" class="kebab-item danger" id="btn-eliminar-habito">
    <i class="fa-solid fa-ban me-2"></i>Deshabilitar hábito
</a>
                </div>
            </div>
        </div>
            
            <div class="text-center mt-2">
                <div class="icon-circle bg-purple-soft mx-auto mb-2">
                    <i class="fa-solid fa-brain text-purple"></i>
                </div>
                <h4 class="fw-bold text-white mb-0 font-sora texto-titulo-fluido">Salud Mental</h4>
            </div>
        </div>

        <div class="my-auto py-2 text-center d-flex flex-column align-items-center justify-content-center">
            <div class="progress-ring ring-purple mx-auto mb-3" id="ring-saludmental">
                <div class="progress-content">
                    <h1 class="fw-bold mb-0 text-white font-sora contador-fluido" id="contador-saludmental">1/2</h1>
                    <span class="text-subtle fw-medium subtexto-fluido">pausas</span>
                </div>
            </div>

            <div class="text-center">
                <span class="text-subtle d-block fw-semibold text-uppercase tracking-wider label-fluido">Meta diaria</span>
                <span class="text-purple fw-bold meta-texto-fluido" id="meta-saludmental">2 pausas conscientes</span>
            </div>
        </div>

        <div class="w-100">
            <div class="pausas-container p-3 rounded-4 mb-3">
                <span class="text-subtle d-block fw-semibold mb-2 label-fluido">Pausas de hoy</span>
                <div class="d-flex justify-content-between align-items-center py-1">
                    <span class="text-white fw-medium subtexto-fluido">8:00 AM</span>
                    <i class="fa-solid fa-circle-check text-purple fs-5"></i>
                </div>
                <div class="d-flex justify-content-between align-items-center py-1">
                    <span class="text-white fw-medium subtexto-fluido">12:10 PM</span>
                    <i class="fa-solid fa-circle-check text-purple fs-5"></i>
                </div>
            </div>

            <button class="btn btn-action-purple w-100 rounded-pill fw-bold font-sora boton-fluido" id="btn-add-pausa">+1 pausa</button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/HSaludMental.js"></script>
</body>
</html>
