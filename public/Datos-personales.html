<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Datos personales del usuario"
        data-i18n="datosPersonales.descripcion">

    <title>LifeSync | Datos personales</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/datos-personales.css">

</head>


<body>

    <main class="contenedor-datos">

        <header class="encabezado">

            <a
                href="perfil.html"
                class="volver"
                data-i18n="comun.volver">

                ← Volver

            </a>


            <h1 data-i18n="datosPersonales.titulo">

                Datos personales

            </h1>

        </header>


        <section class="foto-perfil">

            <div class="marco-perfil">

                <img
                    src="img/Perfil.png"
                    alt="Foto de perfil"
                    id="fotoPerfil"
                    data-i18n-alt="datosPersonales.fotoPerfil">

            </div>


            <label
                for="nuevaFoto"
                class="btn-cambiar-foto"
                data-i18n="datosPersonales.cambiarFoto">

                Cambiar foto

            </label>


            <input
                type="file"
                id="nuevaFoto"
                name="nuevaFoto"
                accept="image/jpeg,image/png,image/webp">

        </section>


        <form
            id="formDatosPersonales"
            autocomplete="off">


            <div class="campo">

                <label
                    for="usuario"
                    data-i18n="datosPersonales.nombreUsuario">

                    Nombre de usuario

                </label>


                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    maxlength="50"
                    required>

            </div>


            <div class="campo">

                <label
                    for="nombreCompleto"
                    data-i18n="datosPersonales.nombreCompleto">

                    Nombre completo

                </label>


                <input
                    type="text"
                    id="nombreCompleto"
                    name="nombreCompleto"
                    maxlength="150">

            </div>


            <div class="campo">

                <label
                    for="correo"
                    data-i18n="datosPersonales.correo">

                    Correo electrónico

                </label>


                <input
                    type="email"
                    id="correo"
                    name="correo"
                    maxlength="150"
                    required>

            </div>


            <div class="campo">

                <label
                    for="fechaNacimiento"
                    data-i18n="datosPersonales.fechaNacimiento">

                    Fecha de nacimiento

                </label>


                <input
                    type="date"
                    id="fechaNacimiento"
                    name="fechaNacimiento">

            </div>


            <div class="campo">

                <label
                    for="genero"
                    data-i18n="datosPersonales.genero">

                    Género

                </label>


                <select
                    id="genero"
                    name="genero">

                    <option
                        value=""
                        data-i18n="datosPersonales.seleccionar">

                        Seleccionar

                    </option>


                    <option
                        value="femenino"
                        data-i18n="datosPersonales.femenino">

                        Femenino

                    </option>


                    <option
                        value="masculino"
                        data-i18n="datosPersonales.masculino">

                        Masculino

                    </option>


                    <option
                        value="otro"
                        data-i18n="datosPersonales.prefieroNoDecirlo">

                        Prefiero no decirlo

                    </option>

                </select>

            </div>


            <hr>


            <h2 data-i18n="datosPersonales.seguridad">

                Seguridad

            </h2>


            <div class="campo">

                <label
                    for="contrasenaActual"
                    data-i18n="datosPersonales.contrasenaActual">

                    Contraseña actual

                </label>


                <input
                    type="password"
                    id="contrasenaActual"
                    name="contrasenaActual"
                    autocomplete="current-password">

            </div>


            <div class="campo">

                <label
                    for="nuevaContrasena"
                    data-i18n="datosPersonales.nuevaContrasena">

                    Nueva contraseña

                </label>


                <input
                    type="password"
                    id="nuevaContrasena"
                    name="nuevaContrasena"
                    autocomplete="new-password">

            </div>


            <div class="campo">

                <label
                    for="confirmarContrasena"
                    data-i18n="datosPersonales.confirmarContrasena">

                    Confirmar nueva contraseña

                </label>


                <input
                    type="password"
                    id="confirmarContrasena"
                    name="confirmarContrasena"
                    autocomplete="new-password">

            </div>


            <p
                id="mensajeDatos"
                class="mensaje-datos"
                aria-live="polite">

            </p>


            <div class="acciones">

                <button
                    type="submit"
                    id="btnGuardar"
                    data-i18n="comun.guardarCambios">

                    Guardar cambios

                </button>


                <button
                    type="button"
                    id="btnCancelar"
                    data-i18n="comun.cancelar">

                    Cancelar

                </button>

            </div>


        </form>

    </main>


    <script src="js/tema-global.js"></script>
    <script src="js/idioma-global.js"></script>
    <script src="js/datos-personales.js"></script>

</body>

</html>
