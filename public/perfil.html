<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Perfil del usuario - LifeSync"
          data-i18n="perfil.metaDescripcion">

    <title>LifeSync | Perfil</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/perfil.css">

</head>

<body>

    <main class="perfil-container">

        <a
            href="inicio.html"
            class="volver"
            data-i18n="comun.volver">

            ← Volver

        </a>


        <section class="perfil-superior">

            <div class="perfil-info">

                <div class="marco-perfil">

                    <img
                        src="img/Perfil.png"
                        alt="Foto de perfil"
                        data-i18n-alt="perfil.fotoPerfil"
                        id="fotoPerfil"
                        class="foto-perfil">

                </div>


                <div class="datos-perfil">

                    <h1 id="nombreUsuario">

                        Usuario

                    </h1>


                    <a
                        href="Datos-personales.html"
                        id="editarPerfil"
                        class="editar-perfil"
                        data-i18n="perfil.editarPerfil">

                        Editar tu perfil

                    </a>

                </div>

            </div>

        </section>


        <nav class="menu-perfil">

            <a
                href="Datos-personales.html"
                class="opcion-menu"
                id="btnDatos">

                <span data-i18n="perfil.datosPersonales">

                    Datos personales

                </span>

                <span>›</span>

            </a>


            <a
                href="Personalizados.html"
                class="opcion-menu"
                id="btnHabitoPersonalizado">

                <span data-i18n="perfil.habitosPersonalizados">

                    Hábitos personalizados

                </span>

                <span>›</span>

            </a>


            <a
                href="recordatorios.html"
                class="opcion-menu"
                id="btnRecordatorios">

                <span data-i18n="perfil.recordatorios">

                    Recordatorios

                </span>

                <span>›</span>

            </a>


            <a
                href="Estadisticas.html"
                class="opcion-menu"
                id="btnEstadisticas">

                <span data-i18n="perfil.estadisticas">

                    Estadísticas

                </span>

                <span>›</span>

            </a>


            <a
                href="Configuracion.html"
                class="opcion-menu"
                id="btnConfiguracion">

                <span data-i18n="perfil.configuracion">

                    Configuración

                </span>

                <span>›</span>

            </a>

        </nav>


        <section class="cerrar-sesion">

            <button
                type="button"
                id="btnCerrarSesion"
                class="btn-cerrar"
                data-i18n="perfil.cerrarSesion">

                Cerrar sesión

            </button>

        </section>

    </main>

    <script src="js/tema-global.js"></script>
    <script src="js/idioma-global.js"></script>
    <script src="js/perfil.js"></script>

</body>

</html>
