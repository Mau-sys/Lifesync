<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="LifeSync - Platform for tracking healthy habits"
        data-i18n="login.metaDescripcion">

    <title>LifeSync | Log In</title>

    <link
        rel="stylesheet"
        href="css/variables.css">

    <link
        rel="stylesheet"
        href="css/general.css">

    <link
        rel="stylesheet"
        href="css/inicio-sesion.css">

</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="logo-container">

                <img
                    id="logo"
                    src="img/Logo-LS-N.png"
                    data-logo-lifesync
                    data-logo-claro="img/Logo-LS.png"
                    data-logo-oscuro="img/Logo-LS-N.png"
                    alt="LifeSync Logo"
                    class="logo">

            </div>

            <form
                id="loginForm"
                class="login-form"
                action=""
                method="post">

                <div class="input-group">

                    <label
                        for="correo"
                        data-i18n="login.correo">

                        Email address

                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Enter your email address"
                        data-i18n-placeholder="login.placeholderCorreo"
                        autocomplete="email"
                        required>

                </div>

                <div class="input-group">

                    <label
                        for="password"
                        data-i18n="login.contrasena">

                        Password

                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        data-i18n-placeholder="login.placeholderContrasena"
                        autocomplete="current-password"
                        required>

                </div>

                <p
                    id="mensajeError"
                    class="mensaje-error"
                    role="alert"
                    aria-live="polite">
                </p>

               

                <button
                    type="submit"
                    id="btnLogin"
                    class="btn-primary"
                    data-i18n="login.iniciarSesion">

                    Log In

                </button>

            </form>

            

            <p class="register-link">

                <span data-i18n="login.noTienesCuenta">

                    Don't have an account?

                </span>

                <a
                    href="Registro.html"
                    data-i18n="login.registrate">

                    Sign Up

                </a>

            </p>

        </section>

    </main>

    <script src="js/idioma-global.js"></script>
    <script src="js/tema-global.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
