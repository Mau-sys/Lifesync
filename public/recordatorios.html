<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Administra los recordatorios de LifeSync">

    <title>LifeSync | Recordatorios</title>

    <link
        rel="stylesheet"
        href="css/variables.css">

    <link
        rel="stylesheet"
        href="css/general.css">

    <link
        rel="stylesheet"
        href="css/recordatorios.css">

</head>

<body>

    <main class="contenedor-recordatorios">

        <header class="encabezado">

            <a
                href="Perfil.html"
                class="volver"
                data-i18n="general.volver">

                ← Volver

            </a>

            <h1 data-i18n="recordatorios.titulo">
                Recordatorios
            </h1>

            <p data-i18n="recordatorios.descripcion">
                Organiza tus recordatorios para no olvidar ninguno de tus hábitos.
            </p>

        </header>


        <section class="nuevo-recordatorio">

            <button
                type="button"
                id="btnNuevoRecordatorio"
                class="btn-principal"
                data-i18n="recordatorios.nuevo">

                Nuevo recordatorio

            </button>

        </section>


        <section
            id="listaRecordatorios"
            class="lista-recordatorios">

        </section>


        <section
            id="sinRecordatorios"
            class="sin-recordatorios">

            <h2 data-i18n="recordatorios.sinRecordatorios">
                No tienes recordatorios.
            </h2>

            <p data-i18n="recordatorios.creaUno">
                Crea uno para comenzar a recibir notificaciones.
            </p>

        </section>

    </main>


    <div
        id="modalRecordatorio"
        class="modal oculto"
        aria-hidden="true">

        <div
            class="modal-contenido"
            role="dialog"
            aria-modal="true"
            aria-labelledby="tituloModalRecordatorio">

            <div class="modal-header">

                <h2
                    id="tituloModalRecordatorio"
                    data-i18n="recordatorios.modal.titulo">

                    Nuevo recordatorio

                </h2>

                <button
                    type="button"
                    id="cerrarModal"
                    class="btn-cerrar"
                    aria-label="Cerrar"
                    data-i18n-aria-label="general.cerrar">

                    ✕

                </button>

            </div>


            <form
                id="recordatorioForm"
                autocomplete="off">

                <div class="campo">

                    <label
                        for="titulo"
                        data-i18n="recordatorios.nombre">

                        Nombre del recordatorio

                    </label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        maxlength="150"
                        placeholder="Ej. Leer 20 páginas"
                        data-i18n-placeholder="recordatorios.nombrePlaceholder"
                        required>

                </div>


                <div class="campo">

                    <label
                        for="categoria"
                        data-i18n="recordatorios.categoria">

                        Categoría

                    </label>

                    <select
                        id="categoria"
                        name="categoria">

                        <option
                            value=""
                            data-i18n="recordatorios.seleccionar">

                            Seleccionar

                        </option>

                        <option
                            value="1"
                            data-i18n="categorias.hidratacion">

                            Hidratación

                        </option>

                        <option
                            value="2"
                            data-i18n="categorias.alimentacion">

                            Alimentación

                        </option>

                        <option
                            value="3"
                            data-i18n="categorias.saludMental">

                            Salud Mental

                        </option>

                        <option
                            value="4"
                            data-i18n="categorias.actividadFisica">

                            Actividad Física

                        </option>

                        <option
                            value="5"
                            data-i18n="categorias.registroAcademico">

                            Registro Académico

                        </option>

                        <option
                            value="6"
                            data-i18n="categorias.habitoPersonalizado">

                            Hábito Personalizado

                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label
                        for="hora"
                        data-i18n="recordatorios.hora">

                        Hora

                    </label>

                    <input
                        type="time"
                        id="hora"
                        name="hora"
                        required>

                </div>


                <div class="campo">

                    <label
                        for="repeticion"
                        data-i18n="recordatorios.repetir">

                        Repetir

                    </label>

                    <select
                        id="repeticion"
                        name="repeticion"
                        required>

                        <option
                            value="diario"
                            data-i18n="recordatorios.todosDias">

                            Todos los días

                        </option>

                        <option
                            value="lunes_viernes"
                            data-i18n="recordatorios.lunesViernes">

                            Lunes a viernes

                        </option>

                        <option
                            value="una_vez"
                            data-i18n="recordatorios.unaVez">

                            Solo una vez

                        </option>

                        <option
                            value="personalizado"
                            data-i18n="recordatorios.personalizado">

                            Personalizado

                        </option>

                    </select>

                </div>


                <div
                    class="campo"
                    id="campoFecha"
                    hidden>

                    <label
                        for="fechaRecordatorio"
                        data-i18n="recordatorios.fecha">

                        Fecha

                    </label>

                    <input
                        type="date"
                        id="fechaRecordatorio"
                        name="fechaRecordatorio">

                </div>


                <div class="campo">

                    <label
                        for="mensaje"
                        data-i18n="recordatorios.mensaje">

                        Mensaje

                    </label>

                    <textarea
                        id="mensaje"
                        name="mensaje"
                        rows="3"
                        maxlength="255"
                        placeholder="Agrega una nota o recordatorio (opcional)"
                        data-i18n-placeholder="recordatorios.mensajePlaceholder"></textarea>

                </div>


                <div class="acciones">

                    <button
                        type="button"
                        id="cancelarRecordatorio"
                        class="btn-secundario"
                        data-i18n="general.cancelar">

                        Cancelar

                    </button>

                    <button
                        type="submit"
                        class="btn-principal"
                        data-i18n="general.guardar">

                        Guardar

                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="js/tema-global.js"></script>
    <script src="js/idioma-global.js"></script>
    <script src="js/recordatorios.js"></script>

</body>

</html>
