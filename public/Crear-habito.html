<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Crea un hábito personalizado en LifeSync"
        data-i18n="crearHabito.descripcionMeta">

    <title>LifeSync | Crear hábito personalizado</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/crear-habito.css">

</head>


<body>

    <main class="habit-page">

        <section class="habit-card">

            <a
                href="Preferencias.html"
                class="btn-back"
                data-i18n="comun.volver">

                ← Volver

            </a>


            <header class="habit-header">

                <h1 data-i18n="crearHabito.titulo">

                    Define tu hábito

                </h1>

                <p data-i18n="crearHabito.descripcion">

                    Personaliza un hábito que se adapte a tus objetivos.

                </p>

            </header>


            <form
                id="habitoForm"
                class="habit-form"
                novalidate>


                <div class="input-group">

                    <label
                        for="nombreHabito"
                        data-i18n="crearHabito.nombreHabito">

                        Nombre del hábito

                    </label>

                    <input
                        type="text"
                        id="nombreHabito"
                        name="nombreHabito"
                        placeholder="Ej. Leer 20 páginas"
                        data-i18n-placeholder="crearHabito.placeholderNombre"
                        maxlength="150"
                        autocomplete="off"
                        required>

                </div>


                <div class="input-group">

                    <label
                        for="objetivo"
                        data-i18n="crearHabito.objetivo">

                        Objetivo

                    </label>

                    <textarea
                        id="objetivo"
                        name="objetivo"
                        rows="3"
                        maxlength="500"
                        placeholder="Describe el objetivo de tu hábito..."
                        data-i18n-placeholder="crearHabito.placeholderObjetivo"
                        required></textarea>

                </div>


                <div class="input-group">

                    <label
                        for="frecuencia"
                        data-i18n="crearHabito.frecuencia">

                        Frecuencia

                    </label>

                    <select
                        id="frecuencia"
                        name="frecuencia"
                        required>

                        <option
                            value=""
                            data-i18n="crearHabito.seleccionar">

                            Selecciona una opción

                        </option>

                        <option
                            value="diaria"
                            data-i18n="crearHabito.diaria">

                            Diario

                        </option>

                        <option
                            value="semanal"
                            data-i18n="crearHabito.semanal">

                            Semanal

                        </option>

                        <option
                            value="mensual"
                            data-i18n="crearHabito.mensual">

                            Mensual

                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label
                        for="fechaInicio"
                        data-i18n="crearHabito.fechaInicio">

                        Fecha de inicio

                    </label>

                    <input
                        type="date"
                        id="fechaInicio"
                        name="fechaInicio"
                        required>

                </div>


                <div class="input-group">

                    <label
                        for="fechaFin"
                        data-i18n="crearHabito.fechaFin">

                        Fecha de finalización

                    </label>

                    <input
                        type="date"
                        id="fechaFin"
                        name="fechaFin">

                    <small
                        class="campo-ayuda"
                        data-i18n="crearHabito.ayudaFechaFin">

                        Puedes dejarla vacía si el hábito no tiene fecha de finalización.

                    </small>

                </div>


                <p
                    id="mensajeHabito"
                    class="mensaje"
                    role="alert"
                    aria-live="polite">
                </p>


                <button
                    type="submit"
                    id="guardarHabito"
                    class="btn-primary"
                    data-i18n="crearHabito.guardar">

                    Guardar hábito

                </button>

            </form>

        </section>

    </main>


    <script src="js/tema-global.js"></script>
    <script src="js/idioma-global.js"></script>
    <script src="js/crear-habito.js"></script>

</body>

</html>
