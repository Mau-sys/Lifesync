<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Registro de usuario en LifeSync">

    <title>LifeSync | Registrarse</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/registro.css">

</head>

<body>

    <main class="register-page">

        <section class="register-card">

            <div class="header-register">

                <h1 data-i18n="registro.titulo">
                    Crear cuenta
                </h1>

                <p data-i18n="registro.subtitulo">
                    Comienza tu mejor versión
                </p>

            </div>

            <form
                id="registroForm"
                class="register-form"
                action=""
                method="post">

                <div class="input-group">

                    <label
                        for="nombre"
                        data-i18n="registro.nombre">

                        Nombre completo

                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre completo"
                        data-i18n-placeholder="registro.nombrePlaceholder"
                        autocomplete="name"
                        maxlength="50"
                        required>

                </div>

                <div class="input-group">

                    <label
                        for="correo"
                        data-i18n="registro.correo">

                        Correo electrónico

                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Ingresa tu correo electrónico"
                        data-i18n-placeholder="registro.correoPlaceholder"
                        autocomplete="email"
                        maxlength="150"
                        required>

                </div>

                <div class="input-group">

                    <label
                        for="password"
                        data-i18n="registro.password">

                        Contraseña

                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Crea una contraseña"
                        data-i18n-placeholder="registro.passwordPlaceholder"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                </div>

                <div class="input-group">

                    <label
                        for="confirmarPassword"
                        data-i18n="registro.confirmarPassword">

                        Confirmar contraseña

                    </label>

                    <input
                        type="password"
                        id="confirmarPassword"
                        name="confirmarPassword"
                        placeholder="Confirma tu contraseña"
                        data-i18n-placeholder="registro.confirmarPlaceholder"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                </div>

                <p
                    id="mensajeError"
                    class="mensaje-error"
                    role="alert"
                    aria-live="polite">
                </p>

                <button
                    type="submit"
                    id="btnRegistro"
                    class="btn-primary"
                    data-i18n="registro.boton">

                    Registrarse

                </button>

            </form>

            <div class="social-register">

                <p data-i18n="registro.continuar">
                    O continúa con
                </p>

                <div class="social-buttons">

                    <button
                        type="button"
                        id="googleRegister"
                        class="social-button"
                        aria-label="Continuar con Google"
                        data-i18n-aria-label="registro.google">

                        <img
                            src="img/Logo-G.png"
                            alt="Google">

                    </button>

                    <button
                        type="button"
                        id="appleRegister"
                        class="social-button"
                        aria-label="Continuar con Apple"
                        data-i18n-aria-label="registro.apple">

                        <img
                            src="img/Logo-A.png"
                            alt="Apple">

                    </button>

                </div>

            </div>

            <p class="login-link">

                <span data-i18n="registro.yaCuenta">
                    ¿Ya tienes una cuenta?
                </span>

                <a
                    href="Inicio-sesion.html"
                    data-i18n="registro.iniciarSesion">

                    Inicia sesión

                </a>

            </p>

        </section>

    </main>

    <script src="js/tema-global.js"></script>

    <script src="js/idioma-global.js"></script>

    <script src="js/registro.js"></script>

</body>

</html>
