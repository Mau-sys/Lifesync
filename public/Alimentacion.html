<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSync - Alimentación</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/Alimentacion.css">
</head>
<body class="bg-lifesync p-0 m-0">

    <div class="card-full-screen d-flex flex-column justify-content-between">
        
        <div>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span></span>
                
                <button class="btn btn-options p-0" id="btn-options-alimentacion" aria-label="Opciones">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
            </div>
            
            <div class="text-center">
                <div class="icon-circle bg-emerald-soft mx-auto mb-2">
                    <i class="fa-solid fa-apple-whole text-emerald"></i>
                </div>
                <h4 class="fw-bold text-white mt-2 mb-0 font-sora texto-titulo-fluido">Alimentación</h4>
            </div>
        </div>

        <div class="my-auto py-2 text-center d-flex flex-column align-items-center justify-content-center">
            <div class="progress-ring ring-emerald mx-auto mb-3" id="ring-comidas">
                <div class="progress-content">
                    <h1 class="fw-bold mb-0 text-white font-sora contador-fluido" id="contador-comidas">2/3</h1>
                    <span class="text-subtle fw-medium subtexto-fluido">comidas</span>
                </div>
            </div>

            <div class="text-center">
                <span class="text-subtle d-block fw-semibold text-uppercase tracking-wider label-fluido">Meta diaria</span>
                <span class="text-emerald fw-bold meta-texto-fluido" id="meta-comidas">3 comidas al día</span>
            </div>
        </div>

        <div class="w-100">
            <div class="d-flex justify-content-around align-items-center mb-3 comidainfo-container p-3 rounded-4" id="lista-comidas">
                <!-- Desayuno (Completado) -->
                <div class="text-center">
                    <i class="fa-solid fa-cloud-sun text-emerald fs-4 mb-1"></i>
                    <span class="d-block text-white fw-medium subtexto-fluido">Desayuno</span>
                </div>
                <!-- Almuerzo (Completado) -->
                <div class="text-center">
                    <i class="fa-solid fa-sun text-emerald fs-4 mb-1"></i>
                    <span class="d-block text-white fw-medium subtexto-fluido">Almuerzo</span>
                </div>
                <!-- Cena (Pendiente - color sutil) -->
                <div class="text-center">
                    <i class="fa-solid fa-moon text-subtle fs-4 mb-1"></i>
                    <span class="d-block text-subtle fw-medium subtexto-fluido">Cena</span>
                </div>
            </div>

            <button class="btn btn-action-emerald w-100 rounded-pill fw-bold font-sora boton-fluido" id="btn-add-comida">+1 comida</button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
