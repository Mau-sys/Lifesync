<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSync - Registro Académico</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/RegistroAcademico.css">
</head>
<body class="bg-lifesync p-0 m-0">

    <div class="card-full-screen d-flex flex-column justify-content-between">
        
        <div>
            <div class="d-flex justify-content-end align-items-center mb-3">
                <div class="position-relative">
                    <button class="btn btn-options p-0" id="btn-options-academico" aria-label="Opciones">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="kebab-dropdown-menu" id="kebab-menu-academico">
                        <button class="kebab-item btn-kebab-action" id="btn-regresar">
                            <i class="fa-solid fa-arrow-left me-2"></i>Regresar
                        </button>
                        <a href="#" class="kebab-item" id="btn-editar-meta">
                            <i class="fa-solid fa-pen-to-square me-2"></i>Editar meta
                        </a>
                        <div class="dropdown-divider my-1"></div>
                        <a href="#" class="kebab-item danger" id="btn-deshabilitar-habito">
                            <i class="fa-solid fa-ban me-2"></i>Deshabilitar hábito
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-2">
                <div class="icon-circle bg-pink-soft mx-auto mb-2">
                    <i class="fa-solid fa-book-open text-pink"></i>
                </div>
                <h4 class="fw-bold text-white mb-0 font-sora texto-titulo-fluido">Registro Académico</h4>
            </div>
        </div>

        <div class="my-auto py-2 text-center d-flex flex-column align-items-center justify-content-center">
            <div class="progress-ring ring-pink mx-auto mb-3" id="ring-sesiones">
                <div class="progress-content">
                    <h1 class="fw-bold mb-0 text-white font-sora contador-fluido" id="contador-sesiones">0/0</h1>
                    <span class="text-subtle fw-medium subtexto-fluido">sesiones</span>
                </div>
            </div>

            <div class="text-center">
                <span class="text-subtle d-block fw-semibold text-uppercase tracking-wider label-fluido">Meta diaria</span>
                <span class="text-pink fw-bold meta-texto-fluido" id="meta-sesiones">-- sesiones de estudio</span>
            </div>
        </div>

        <div class="w-100">
            <div class="tiempo-box p-3 rounded-4 mb-3 text-center" id="box-tiempo">
                <span class="text-subtle d-block fw-semibold label-fluido text-uppercase tracking-wider mb-1">Tiempo acumulado</span>
                <span class="text-pink fw-bold meta-texto-fluido" id="tiempo-acumulado">0 min / 0 min</span>
            </div>

            <button class="btn btn-action-pink w-100 rounded-pill fw-bold font-sora boton-fluido" id="btn-add-sesion">+1 sesión de estudio</button>
        </div>

    </div>

    <div class="modal fade" id="modalConfiguracion" tabindex="-1" aria-labelledby="modalConfiguracionLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-lifesync p-2">
                <div class="modal-header border-0 pb-0 d-flex justify-content-between align-items-center">
                    <h5 class="modal-title font-sora fw-bold text-white d-flex align-items-center gap-2 mb-0" id="modalConfiguracionLabel">
                        <i class="fa-solid fa-gear text-pink"></i>Editar Meta Académica
                    </h5>
                    <button type="button" class="btn-close btn-close-white m-0" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body py-4">
                    <form id="form-config-meta">
                        <div class="mb-3">
                            <label for="select-frecuencia" class="form-label text-subtle fw-semibold">Frecuencia de la meta</label>
                            <select class="form-select custom-input" id="select-frecuencia">
                                <option value="diario">Diaria (Se reinicia cada día)</option>
                                <option value="mensual">Mensual (Se reinicia el día 1 de cada mes)</option>
                                <option value="personalizada">Personalizada (Días específicos)</option>
                            </select>
                        </div>

                        <div class="mb-3 d-none" id="contenedor-dias-semana">
                            <label class="form-label text-subtle fw-semibold d-block">Días activos de la meta</label>
                            <div class="d-flex justify-content-between gap-1" id="grupo-dias-semana">
                                <button type="button" class="btn btn-dia-semana flex-fill py-2 p-0" data-dia="1">L</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2 p-0" data-dia="2">M</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2 p-0" data-dia="3">X</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2 p-0" data-dia="4">J</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2 p-0" data-dia="5">V</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2 p-0" data-dia="6">S</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2 p-0" data-dia="0">D</button>
                            </div>
                            <small class="text-subtle mt-1 d-block" style="font-size: 0.75rem;">La meta se reiniciará al comenzar cada día activo seleccionado.</small>
                        </div>

                        <div class="mb-3">
                            <label for="input-num-sesiones" class="form-label text-subtle fw-semibold" id="label-num-sesiones">Cantidad de sesiones por periodo (Máx. 100)</label>
                            <input type="number" class="form-control custom-input" id="input-num-sesiones" min="1" max="100" value="5" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="input-duracion-sesion" class="form-label text-subtle fw-semibold">Duración por sesión (Máx. 240 min)</label>
                            <div class="input-group">
                                <input type="number" class="form-control custom-input input-group-left" id="input-duracion-sesion" min="5" max="240" step="5" value="45" required>
                                <span class="input-group-text custom-input-suffix">minutos</span>
                            </div>
                        </div>
                        
                        <div class="p-3 bg-pink-soft rounded-3 border border-pink border-opacity-25 text-center">
                            <span class="text-subtle d-block small">Tiempo de estudio meta estimado:</span>
                            <span class="fw-bold text-pink fs-5" id="preview-meta-total">0 min (0 hrs 0 min)</span>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0 px-3 pb-3">
                    <div class="footer-buttons-container w-100">
                        <button type="button" class="btn btn-outline-danger-custom rounded-pill px-3 py-2 fw-semibold" id="btn-reiniciar-meta">
                            <i class="fa-solid fa-rotate-right me-1"></i>Reiniciar
                        </button>
                        
                        <div class="actions-right">
                            <button type="button" class="btn btn-secondary-custom rounded-pill px-3 py-2 fw-semibold" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-action-pink rounded-pill px-3 py-2 fw-bold" id="btn-guardar-meta">Guardar cambios</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/tema-global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/HRegistroAcademico.js"></script>
</body>
</html>
