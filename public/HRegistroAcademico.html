<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title data-i18n="registroAcademico.tituloPagina">
        LifeSync - Registro Académico
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link
        rel="stylesheet"
        href="css/RegistroAcademico.css">

</head>

<body class="bg-lifesync p-0 m-0">

    <div class="card-full-screen d-flex flex-column justify-content-between">

        <div>

            <div class="d-flex justify-content-end align-items-center mb-3">

                <div class="position-relative">

                    <button
                        class="btn btn-options p-0"
                        id="btn-options-academico"
                        aria-label="Opciones"
                        data-i18n-aria-label="comun.opciones">

                        <i class="fa-solid fa-ellipsis-vertical"></i>

                    </button>

                    <div
                        class="kebab-dropdown-menu"
                        id="kebab-menu-academico">

                        <button
                            class="kebab-item btn-kebab-action"
                            id="btn-regresar">

                            <i class="fa-solid fa-arrow-left me-2"></i>

                            <span data-i18n="comun.regresar">
                                Regresar
                            </span>

                        </button>

                        <a
                            href="#"
                            class="kebab-item"
                            id="btn-editar-meta"
                            data-bs-toggle="modal"
                            data-bs-target="#modalEditarAcademico">

                            <i class="fa-solid fa-pen-to-square me-2"></i>

                            <span data-i18n="registroAcademico.editarMeta">
                                Editar meta
                            </span>

                        </a>

                        <div class="dropdown-divider my-1"></div>

                        <a
                            href="#"
                            class="kebab-item danger"
                            id="btn-deshabilitar-habito">

                            <i class="fa-solid fa-ban me-2"></i>

                            <span data-i18n="comun.deshabilitarHabito">
                                Deshabilitar hábito
                            </span>

                        </a>

                    </div>

                </div>

            </div>

            <div class="text-center mt-2">

                <div class="icon-circle bg-pink-soft mx-auto mb-2">

                    <i class="fa-solid fa-book-open text-pink"></i>

                </div>

                <h4
                    class="fw-bold text-white mb-0 font-sora texto-titulo-fluido"
                    data-i18n="registroAcademico.titulo">

                    Registro Académico

                </h4>

            </div>

        </div>


        <div class="my-auto py-2 text-center d-flex flex-column align-items-center justify-content-center">

            <div
                class="progress-ring ring-pink mx-auto mb-3"
                id="ring-academico">

                <div class="progress-content">

                    <h1
                        class="fw-bold mb-0 text-white font-sora contador-fluido"
                        id="contador-academico">

                        0/3

                    </h1>

                    <span
                        class="text-subtle fw-medium subtexto-fluido"
                        data-i18n="registroAcademico.registros">

                        registros

                    </span>

                </div>

            </div>

            <div class="text-center">

                <!-- ETIQUETA DINÁMICA SEGÚN FRECUENCIA -->
                <span
                    class="text-subtle d-block fw-semibold text-uppercase tracking-wider label-fluido"
                    id="label-meta-frecuencia"
                    data-i18n="registroAcademico.metaDiaria">

                    Meta Diaria

                </span>

                <span
                    class="text-pink fw-bold meta-texto-fluido d-block"
                    id="meta-academico">

                    3 registros académicos

                </span>

                <!-- TOTAL DE HORAS CALCULADAS ENTRE TODAS LAS SESIONES -->
                <small class="text-subtle fw-medium d-block mt-1" id="meta-horas-totales">

                    Total: 2h 15m de estudio

                </small>

            </div>

        </div>


        <div class="w-100">

            <div class="registro-card-container p-3 rounded-4 mb-3">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <span
                        class="text-subtle fw-semibold label-fluido"
                        data-i18n="registroAcademico.progreso">

                        Progreso de Sesiones

                    </span>

                    <span
                        class="badge rounded-pill bg-pink-soft text-pink px-2 py-1 small fw-bold"
                        id="sesiones-resumen-badge">

                        0 de 3 completadas

                    </span>

                </div>

                <div class="sesiones-grid" id="lista-registros"></div>

            </div>

            <button
                class="btn btn-action-pink w-100 rounded-pill fw-bold font-sora boton-fluido"
                id="btn-add-registro">

                <span data-i18n="registroAcademico.agregarRegistro">
                    +1 registro
                </span>

            </button>

        </div>

    </div>


    <!-- MODAL DE CONFIGURACIÓN -->
    <div
        class="modal fade"
        id="modalEditarAcademico"
        tabindex="-1"
        aria-labelledby="modalEditarAcademicoLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content modal-lifesync text-white border-0 rounded-4">

                <div class="modal-header border-bottom border-secondary border-opacity-25">

                    <h5
                        class="modal-title font-sora fw-bold"
                        id="modalEditarAcademicoLabel">

                        <i class="fa-solid fa-gear text-pink me-2"></i>

                        <span data-i18n="registroAcademico.editarMetaTitulo">
                            Editar Meta Académica
                        </span>

                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                        data-i18n-aria-label="comun.cerrar">

                    </button>

                </div>

                <div class="modal-body py-4">

                    <form id="form-config-academico">

                        <!-- 1. FRECUENCIA -->
                        <div class="mb-3">

                            <label
                                for="select-frecuencia"
                                class="form-label text-subtle fw-semibold"
                                data-i18n="registroAcademico.frecuencia">

                                Frecuencia

                            </label>

                            <select
                                class="form-select custom-input"
                                id="select-frecuencia">

                                <option value="diaria" selected data-i18n="frecuencia.diaria">Diaria</option>
                                <option value="semanal" data-i18n="frecuencia.semanal">Semanal</option>
                                <option value="mensual" data-i18n="frecuencia.mensual">Mensual</option>
                                <option value="personalizada" data-i18n="frecuencia.personalizada">Personalizada (días específicos)</option>

                            </select>

                        </div>

                        <!-- DÍAS ACTIVOS (PERSONALIZADO) -->
                        <div class="mb-3 d-none" id="contenedor-dias-semana">

                            <label class="form-label text-subtle fw-semibold" data-i18n="comun.seleccionarDias">
                                Días activos
                            </label>

                            <div class="d-flex justify-content-between gap-1 mt-1">

                                <button type="button" class="btn btn-dia-semana flex-fill py-2 active" data-dia="1">L</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2 active" data-dia="2">M</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2 active" data-dia="3">X</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2 active" data-dia="4">J</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2 active" data-dia="5">V</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2" data-dia="6">S</button>
                                <button type="button" class="btn btn-dia-semana flex-fill py-2" data-dia="0">D</button>

                            </div>

                        </div>

                        <!-- 2. CANTIDAD DE SESIONES -->
                        <div class="mb-3">

                            <label
                                for="input-registros"
                                class="form-label text-subtle fw-semibold"
                                data-i18n="registroAcademico.cantidadRegistros">

                                Cantidad de sesiones (Máx. 20)

                            </label>

                            <input
                                type="number"
                                class="form-control custom-input"
                                id="input-registros"
                                min="1"
                                max="20"
                                value="3"
                                required>

                        </div>

                        <!-- 3. MINUTOS POR SESIÓN (LÍMITE MÁXIMO DE 180 MIN) -->
                        <div class="mb-3">

                            <label
                                for="input-duracion-sesion"
                                class="form-label text-subtle fw-semibold"
                                data-i18n="registroAcademico.duracionSesion">

                                Minutos por sesión (Máx. 180 min)

                            </label>

                            <div class="input-group">

                                <input
                                    type="number"
                                    class="form-control custom-input input-group-left"
                                    id="input-duracion-sesion"
                                    min="5"
                                    max="180"
                                    step="5"
                                    value="45"
                                    required>

                                <span class="custom-input-suffix">
                                    min
                                </span>

                            </div>

                        </div>

                    </form>

                </div>

                <div class="modal-footer border-top border-secondary border-opacity-25">

                    <div class="footer-buttons-container">

                        
                        <div class="actions-right">

                            <button
                                type="button"
                                class="btn btn-secondary-custom rounded-pill px-3 me-2"
                                data-bs-dismiss="modal">

                                <span data-i18n="comun.cancelar">
                                    Cancelar
                                </span>

                            </button>

                            <button
                                type="button"
                                class="btn btn-action-pink rounded-pill px-4"
                                id="btn-guardar-config">

                                <span data-i18n="comun.guardarCambios">
                                    Guardar cambios
                                </span>

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="js/idioma-global.js"></script>
    <script src="js/tema-global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/HabitoUniversal.js"></script>
    <script src="js/HRegistroAcademico.js"></script>
    

</body>

</html>
