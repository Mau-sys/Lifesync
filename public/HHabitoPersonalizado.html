<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="personalizado.tituloPagina">LifeSync - Hábito Personalizado</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/habitoPersonalizado.css">
    <link rel="stylesheet" href="css/variables.css"><link>
</head>

<body class="bg-lifesync p-0 m-0">

    <div class="card-full-screen d-flex flex-column justify-content-between">

        <div>
            <div class="d-flex justify-content-end align-items-center mb-3">
                <div class="position-relative">
                    <button class="btn btn-options p-0" id="btn-options-personalizado" aria-label="Opciones" data-i18n-aria-label="comun.opciones">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>

                    <div class="kebab-dropdown-menu" id="kebab-menu-personalizado">
                        <a href="inicio.html" class="kebab-item" id="btn-regresar">
                            <i class="fa-solid fa-arrow-left me-2"></i>
                            <span data-i18n="comun.regresar">Regresar</span>
                        </a>

                        <a href="#" class="kebab-item" id="btn-editar-meta">
                            <i class="fa-solid fa-pen-to-square me-2"></i>
                            <span data-i18n="personalizado.editarMeta">Editar hábito</span>
                        </a>

                        <div class="dropdown-divider my-1"></div>

                        <a href="#" class="kebab-item danger" id="btn-eliminar-habito">
                            <i class="fa-solid fa-trash me-2"></i>
                            <span data-i18n="personalizado.eliminarHabito">Eliminar hábito</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="text-center mt-2">
                <div class="icon-circle bg-orange-soft mx-auto mb-2">
                    <i class="fa-regular fa-star text-orange"></i>
                </div>
                <h4 class="fw-bold text-white mb-0 font-sora texto-titulo-fluido" id="titulo-habito" data-i18n="personalizado.habitoPersonalizado">
                    Hábito Personalizado
                </h4>
            </div>
        </div>

        <div class="my-auto py-2 text-center d-flex flex-column align-items-center justify-content-center">
            <div class="progress-ring ring-orange mx-auto mb-3" id="ring-veces-personalizado">
                <div class="progress-content">
                    <h1 class="fw-bold mb-0 text-white font-sora contador-fluido" id="contador-veces-personalizado">
                        0/1
                    </h1>
                    <span class="text-subtle fw-medium subtexto-fluido" data-i18n="personalizado.veces">
                        veces
                    </span>
                </div>
            </div>

            <div class="text-center">
                <span class="text-subtle d-block fw-semibold text-uppercase tracking-wider label-fluido" data-i18n="personalizado.miHabito">
                    Objetivo
                </span>
                <span class="text-orange fw-bold meta-texto-fluido" id="habito-descripcion" data-i18n="comun.cargando">
                    Cargando...
                </span>
            </div>
        </div>

        <div class="w-100">
            <div class="frecuencia-box p-3 rounded-4 mb-3 text-center" id="box-frecuencia">
                <span class="text-subtle d-block fw-semibold label-fluido text-uppercase tracking-wider mb-1" data-i18n="personalizado.frecuencia">
                    Frecuencia
                </span>
                <span class="text-white fw-bold meta-texto-fluido" id="habito-frecuencia" data-i18n="frecuencia.diario">
                    Diario
                </span>
            </div>

            <p id="mensaje-dia-bloqueado" class="text-warning text-center small fw-semibold d-none mb-3" data-i18n="personalizado.mensajeBloqueado">
                Hoy no es un día programado para este hábito.
            </p>

            <button class="btn btn-action-orange w-100 rounded-pill fw-bold font-sora boton-fluido" id="btn-add-registro">
                <span data-i18n="personalizado.btnRegistro">+1 registro</span>
            </button>
        </div>

    </div>

    <div class="modal fade" id="modalEditarHabito" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content config-modal-bg text-white border-0 rounded-4">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title font-sora fw-bold">
                        <i class="fa-solid fa-gear text-orange me-2"></i>
                        <span data-i18n="personalizado.modalEditarTitulo">Editar Hábito</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar" data-i18n-aria-label="comun.cerrar"></button>
                </div>

                <form id="formEditarHabito">
                    <div class="modal-body py-4">
                        <div class="mb-3">
                            <label for="editNombre" class="form-label text-subtle fw-semibold" data-i18n="personalizado.lblNombre">Nombre del Hábito</label>
                            <input type="text" class="form-control config-input text-white" id="editNombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="editDescripcion" class="form-label text-subtle fw-semibold" data-i18n="personalizado.lblDescripcion">Objetivo / Descripción</label>
                            <textarea class="form-control config-input text-white" id="editDescripcion" rows="2" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="editObjetivo" class="form-label text-subtle fw-semibold" data-i18n="personalizado.lblObjetivo">Meta diaria (registros/veces)</label>
                            <input type="number" class="form-control config-input text-white" id="editObjetivo" min="1" required>
                        </div>

                        <div class="mb-3">
                            <label for="editFrecuencia" class="form-label text-subtle fw-semibold" data-i18n="personalizado.frecuencia">Frecuencia</label>
                            <select class="form-select config-input text-white" id="editFrecuencia" required>
                                <option value="diaria" data-i18n="frecuencia.diario">Diario</option>
                                <option value="semanal" data-i18n="frecuencia.semanal">Semanal</option>
                                <option value="mensual" data-i18n="frecuencia.mensual">Mensual</option>
                                <option value="dias específicos" data-i18n="frecuencia.personalizada">Personalizado (Días específicos)</option>
                            </select>
                        </div>

                        <div class="mb-3 d-none" id="contenedorDiasSemana">
                            <label class="form-label text-subtle fw-semibold d-block" data-i18n="personalizado.lblSeleccionaDias">Selecciona los días habilitados:</label>
                            <div class="btn-group w-100 d-flex gap-1" role="group" aria-label="Días de la semana">
                                <input type="checkbox" class="btn-check" id="day-1" name="diasSemana" value="1" autocomplete="off">
                                <label class="btn btn-outline-warning btn-sm flex-fill rounded-3" for="day-1" data-i18n="dias.lunesCorto">L</label>

                                <input type="checkbox" class="btn-check" id="day-2" name="diasSemana" value="2" autocomplete="off">
                                <label class="btn btn-outline-warning btn-sm flex-fill rounded-3" for="day-2" data-i18n="dias.martesCorto">M</label>

                                <input type="checkbox" class="btn-check" id="day-3" name="diasSemana" value="3" autocomplete="off">
                                <label class="btn btn-outline-warning btn-sm flex-fill rounded-3" for="day-3" data-i18n="dias.miercolesCorto">X</label>

                                <input type="checkbox" class="btn-check" id="day-4" name="diasSemana" value="4" autocomplete="off">
                                <label class="btn btn-outline-warning btn-sm flex-fill rounded-3" for="day-4" data-i18n="dias.juevesCorto">J</label>

                                <input type="checkbox" class="btn-check" id="day-5" name="diasSemana" value="5" autocomplete="off">
                                <label class="btn btn-outline-warning btn-sm flex-fill rounded-3" for="day-5" data-i18n="dias.viernesCorto">V</label>

                                <input type="checkbox" class="btn-check" id="day-6" name="diasSemana" value="6" autocomplete="off">
                                <label class="btn btn-outline-warning btn-sm flex-fill rounded-3" for="day-6" data-i18n="dias.sabadoCorto">S</label>

                                <input type="checkbox" class="btn-check" id="day-7" name="diasSemana" value="7" autocomplete="off">
                                <label class="btn btn-outline-warning btn-sm flex-fill rounded-3" for="day-7" data-i18n="dias.domingoCorto">D</label>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer border-top border-secondary border-opacity-25 d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-outline-light rounded-pill px-3" data-bs-dismiss="modal">
                            <span data-i18n="comun.cancelar">Cancelar</span>
                        </button>
                        <button type="submit" class="btn btn-action-orange rounded-pill px-4">
                            <span data-i18n="comun.guardarCambios">Guardar cambios</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/idioma-global.js"></script>
    <script src="js/tema-global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/HHabitoPersonalizado.js"></script>

</body>

</html>
