<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title data-i18n="personalizado.tituloPagina">
        LifeSync - Hábito Personalizado
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link
        rel="stylesheet"
        href="css/habitoPersonalizado.css">

</head>

<body class="bg-lifesync p-0 m-0">

    <div class="card-full-screen d-flex flex-column justify-content-between">

        <div>

            <div class="d-flex justify-content-end align-items-center mb-3">

                <div class="position-relative">

                    <button
                        class="btn btn-options p-0"
                        id="btn-options-personalizado"
                        aria-label="Opciones"
                        data-i18n-aria-label="comun.opciones">

                        <i class="fa-solid fa-ellipsis-vertical"></i>

                    </button>

                    <div
                        class="kebab-dropdown-menu"
                        id="kebab-menu-personalizado">

                        <a
                            href="inicio.html"
                            class="kebab-item"
                            id="btn-regresar">

                            <i class="fa-solid fa-arrow-left me-2"></i>

                            <span data-i18n="comun.regresar">
                                Regresar
                            </span>

                        </a>

                        <a
                            href="#"
                            class="kebab-item"
                            id="btn-editar-meta">

                            <i class="fa-solid fa-pen-to-square me-2"></i>

                            <span data-i18n="personalizado.editarMeta">
                                Editar hábito
                            </span>

                        </a>

                        <div class="dropdown-divider my-1"></div>

                        <a
                            href="#"
                            class="kebab-item danger"
                            id="btn-eliminar-habito">

                            <i class="fa-solid fa-trash me-2"></i>

                            <span data-i18n="personalizado.eliminarHabito">
                                Eliminar hábito
                            </span>

                        </a>

                    </div>

                </div>

            </div>

            <div class="text-center mt-2">

                <div class="icon-circle bg-orange-soft mx-auto mb-2">

                    <i class="fa-regular fa-star text-orange"></i>

                </div>

                <h4
                    class="fw-bold text-white mb-0 font-sora texto-titulo-fluido"
                    id="titulo-habito">

                    Hábito Personalizado

                </h4>

            </div>

        </div>


        <div class="my-auto py-2 text-center d-flex flex-column align-items-center justify-content-center">

            <div
                class="progress-ring ring-orange mx-auto mb-3"
                id="ring-veces-personalizado">

                <div class="progress-content">

                    <h1
                        class="fw-bold mb-0 text-white font-sora contador-fluido"
                        id="contador-veces-personalizado">

                        0/1

                    </h1>

                    <span
                        class="text-subtle fw-medium subtexto-fluido"
                        data-i18n="personalizado.veces">

                        veces

                    </span>

                </div>

            </div>

            <div class="text-center">

                <span
                    class="text-subtle d-block fw-semibold text-uppercase tracking-wider label-fluido"
                    data-i18n="personalizado.miHabito">

                    Objetivo

                </span>

                <span
                    class="text-orange fw-bold meta-texto-fluido"
                    id="habito-descripcion">

                    Cargando...

                </span>

            </div>

        </div>


        <div class="w-100">

            <div
                class="frecuencia-box p-3 rounded-4 mb-3 text-center"
                id="box-frecuencia">

                <span
                    class="text-subtle d-block fw-semibold label-fluido text-uppercase tracking-wider mb-1"
                    data-i18n="personalizado.frecuencia">

                    Frecuencia

                </span>

                <span
                    class="text-white fw-bold meta-texto-fluido"
                    id="habito-frecuencia">

                    Diario

                </span>

            </div>

            <p
                id="mensaje-dia-bloqueado"
                class="text-warning text-center small fw-semibold d-none mb-3">

                Hoy no es un día programado para este hábito.

            </p>

            <button
                class="btn btn-action-orange w-100 rounded-pill fw-bold font-sora boton-fluido"
                id="btn-add-registro">

                <span>+1 registro</span>

            </button>

        </div>

    </div>


    <!-- Modal Editar Hábito -->

    <div
        class="modal fade"
        id="modalEditarHabito"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content bg-dark text-white border-secondary">

                <div class="modal-header border-secondary">

                    <h5 class="modal-title fw-bold">

                        Editar Hábito

                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>

                </div>

                <form id="formEditarHabito">

                    <div class="modal-body">

                        <div class="mb-3">

                            <label
                                for="editNombre"
                                class="form-label text-subtle">

                                Nombre del Hábito

                            </label>

                            <input
                                type="text"
                                class="form-control bg-dark text-white border-secondary"
                                id="editNombre"
                                required>

                        </div>

                        <div class="mb-3">

                            <label
                                for="editDescripcion"
                                class="form-label text-subtle">

                                Objetivo / Descripción

                            </label>

                            <textarea
                                class="form-control bg-dark text-white border-secondary"
                                id="editDescripcion"
                                rows="2"
                                required></textarea>

                        </div>

                        <div class="mb-3">

                            <label
                                for="editObjetivo"
                                class="form-label text-subtle">

                                Meta diaria (registros/veces)

                            </label>

                            <input
                                type="number"
                                class="form-control bg-dark text-white border-secondary"
                                id="editObjetivo"
                                min="1"
                                required>

                        </div>

                        <div class="mb-3">

                            <label
                                for="editFrecuencia"
                                class="form-label text-subtle">

                                Frecuencia

                            </label>

                            <select
                                class="form-select bg-dark text-white border-secondary"
                                id="editFrecuencia"
                                required>

                                <option value="diaria">

                                    Diario

                                </option>

                                <option value="semanal">

                                    Semanal

                                </option>

                                <option value="mensual">

                                    Mensual

                                </option>

                                <option value="dias específicos">

                                    Personalizado (Días específicos)

                                </option>

                            </select>

                        </div>


                        <!-- Días de la semana -->

                        <div
                            class="mb-3 d-none"
                            id="contenedorDiasSemana">

                            <label class="form-label text-subtle d-block">

                                Selecciona los días habilitados:

                            </label>

                            <div class="d-flex justify-content-between gap-1">

                                <label class="btn btn-outline-warning btn-sm flex-fill">

                                    <input
                                        type="checkbox"
                                        name="diasSemana"
                                        value="1"> L

                                </label>

                                <label class="btn btn-outline-warning btn-sm flex-fill">

                                    <input
                                        type="checkbox"
                                        name="diasSemana"
                                        value="2"> M

                                </label>

                                <label class="btn btn-outline-warning btn-sm flex-fill">

                                    <input
                                        type="checkbox"
                                        name="diasSemana"
                                        value="3"> X

                                </label>

                                <label class="btn btn-outline-warning btn-sm flex-fill">

                                    <input
                                        type="checkbox"
                                        name="diasSemana"
                                        value="4"> J

                                </label>

                                <label class="btn btn-outline-warning btn-sm flex-fill">

                                    <input
                                        type="checkbox"
                                        name="diasSemana"
                                        value="5"> V

                                </label>

                                <label class="btn btn-outline-warning btn-sm flex-fill">

                                    <input
                                        type="checkbox"
                                        name="diasSemana"
                                        value="6"> S

                                </label>

                                <label class="btn btn-outline-warning btn-sm flex-fill">

                                    <input
                                        type="checkbox"
                                        name="diasSemana"
                                        value="7"> D

                                </label>

                            </div>

                        </div>

                    </div>

                    <div class="modal-footer border-secondary">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Cancelar

                        </button>

                        <button
                            type="submit"
                            class="btn btn-action-orange rounded-pill px-4">

                            Guardar Cambios

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="js/idioma-global.js"></script>
    <script src="js/tema-global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/HHabitoPersonalizado.js"></script>

</body>

</html>
