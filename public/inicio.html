<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Panel principal de LifeSync"
        data-i18n="inicio.metaDescripcion">

    <title>LifeSync | Inicio</title>

    <link
        rel="stylesheet"
        href="css/variables.css">

    <link
        rel="stylesheet"
        href="css/general.css">

    <link
        rel="stylesheet"
        href="css/inicio.css">

</head>

<body>

<main class="dashboard">

    <header class="header">

        <a
            href="perfil.html"
            class="perfil">

            <div class="marco-perfil">

                <img
                    src="img/Perfil.png"
                    alt="Foto de perfil"
                    data-i18n-alt="inicio.fotoPerfil"
                    id="fotoPerfil"
                    class="foto-perfil">

            </div>

            <div>

                <p class="saludo">

                    <span data-i18n="inicio.hola">
                        ¡Hola,
                    </span>

                    <span id="nombreUsuario">
                        Usuario
                    </span>!

                </p>

                <span id="fechaActual"></span>

            </div>

        </a>


        <button
            type="button"
            id="btnNotificaciones"
            class="btn-notificaciones"
            aria-label="Abrir notificaciones"
            data-i18n-aria-label="inicio.abrirNotificaciones"
            aria-expanded="false"
            aria-controls="panelNotificaciones">

            <img
                src="img/Campana.png"
                alt="Notificaciones"
                data-i18n-alt="inicio.notificaciones">

            <span
                id="contadorNotificaciones"
                class="contador-notificaciones"
                aria-label="Notificaciones no leídas"
                data-i18n-aria-label="inicio.notificacionesNoLeidas">

                0

            </span>

        </button>

    </header>


    <section
        id="panelNotificaciones"
        class="panel-notificaciones oculto"
        aria-hidden="true">

        <div class="panel-header">

            <div>

                <h2 data-i18n="inicio.notificaciones">

                    Notificaciones

                </h2>

                <span
                    class="estado-notificaciones"
                    data-i18n="inicio.estadoNotificaciones">

                    Recordatorios, rachas, progreso y logros

                </span>

            </div>

            <button
                type="button"
                id="cerrarPanel"
                class="cerrar-panel"
                aria-label="Cerrar panel"
                data-i18n-aria-label="comun.cerrarPanel">

                ✕

            </button>

        </div>


        <div
            id="listaNotificaciones"
            class="lista-notificaciones">

            <div class="sin-notificaciones">

                <img
                    src="img/Campana.png"
                    alt="Sin notificaciones"
                    data-i18n-alt="inicio.sinNotificaciones">

                <h3 data-i18n="inicio.todoAlDia">

                    Todo está al día

                </h3>

                <p data-i18n="inicio.descripcionNotificaciones">

                    Aquí aparecerán tus recordatorios,
                    logros, rachas, hábitos completados
                    y avisos de LifeSync.

                </p>

            </div>

        </div>

    </section>


    <div
        id="overlayNotificaciones"
        class="overlay-notificaciones oculto">
    </div>


    <a
        href="rachas.html"
        class="tarjeta-racha"
        aria-label="Ir a Rachas"
        data-i18n-aria-label="inicio.irRachas">

        <div class="info-racha">

            <img
                src="img/Racha.png"
                alt="Racha"
                data-i18n-alt="inicio.racha">

            <div>

                <span id="diasRacha">
                    0
                </span>

                <p data-i18n="inicio.diasEnRacha">

                    días en racha

                </p>

            </div>

        </div>

        <span
            class="flecha"
            aria-hidden="true">

            →

        </span>

    </a>


    <section class="progreso">

        <div class="titulo-progreso">

            <span data-i18n="inicio.progresoDelDia">

                Progreso del día

            </span>

            <span id="porcentajeGeneral">

                0%

            </span>

        </div>

        <div class="barra-progreso">

            <div id="barraProgreso"></div>

        </div>

    </section>


    <section class="categorias">

        <h2 data-i18n="inicio.hoy">

            Hoy

        </h2>


        <div id="contenedorCategorias"></div>


        <a
            href="categorias.html"
            class="btnCategorias">

            <span data-i18n="inicio.verCategorias">

                Ver todas las categorías

            </span>

            <span aria-hidden="true">

                →

            </span>

        </a>

    </section>

</main>

<script src="js/sonido-notificaciones.js"></script>
<script src="js/tema-global.js"></script>
<script src="js/idioma-global.js"></script>
<script src="js/inicio.js"></script>

</body>

</html>
