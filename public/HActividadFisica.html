<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSync - Actividad Física</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/ActividadFisica.css">
</head>
<body class="bg-lifesync p-0 m-0">

    <div class="card-full-screen d-flex flex-column justify-content-between">
        
        <div>
             <div class="d-flex justify-content-end align-items-center mb-3">
                <div class="position-relative">
                    <button class="btn btn-options p-0" id="btn-options-academico" aria-label="Opciones">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="kebab-dropdown-menu" id="kebab-menu-academico">
                        <a href="inicio.html" class="kebab-item" id="btn-regresar">
                            <i class="fa-solid fa-arrow-left me-2"></i>Regresar
                        </a>
                         <a href="inicio.html" class="kebab-item" id="btn-editar-meta">
                            <i class="fa-solid fa-pen-to-square me-2"></i>Editar meta
                        </a>
                        <div class="dropdown-divider my-1"></div>
                        <a href="#" class="kebab-item danger" id="btn-deshabilitar-habito">
                            <i class="fa-solid fa-ban me-2"></i>Deshabilitar hábito
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="text-center">
                <div class="icon-circle bg-amber-soft mx-auto mb-2">
                    <i class="fa-solid fa-dumbbell text-amber"></i>
                </div>
                <h4 class="fw-bold text-white mt-2 mb-0 font-sora texto-titulo-fluido">Actividad Física</h4>
            </div>
        </div>

        <div class="my-auto py-2 text-center d-flex flex-column align-items-center justify-content-center">
            <div class="progress-ring ring-amber mx-auto mb-3" id="ring-sesiones-fisica">
                <div class="progress-content">
                    <h1 class="fw-bold mb-0 text-white font-sora contador-fluido" id="contador-sesiones-fisica">1/5</h1>
                    <span class="text-subtle fw-medium subtexto-fluido">sesiones</span>
                </div>
            </div>

            <div class="text-center">
                <span class="text-subtle d-block fw-semibold text-uppercase tracking-wider label-fluido">Meta diaria</span>
                <span class="text-amber fw-bold meta-texto-fluido" id="meta-fisica">5 sesiones semanales</span>
            </div>
        </div>

        <div class="w-100">
            <div class="tiempo-box text-center rounded-4 mb-3" id="box-tiempo-fisica">
                <span class="text-subtle d-block fw-semibold text-uppercase tracking-wider mb-1 label-fluido">Tiempo acumulado</span>
                <span class="text-amber fw-bold tiempo-texto-fluido" id="tiempo-acumulado-fisica">40 min / 150 min</span>
            </div>

            <button class="btn btn-action-amber w-100 rounded-pill fw-bold font-sora boton-fluido" id="btn-add-sesion-fisica">+1 sesión</button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/HActividadFisica.js"></script>
</body>
</html>
